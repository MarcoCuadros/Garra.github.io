<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprendiendo Boostrap</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    
</head>
<body>
    <!--anchura altura para la altura hay que poner dentro de un
    style="height: 500px; para que ande h-25"-->
    <div class="container border" style="height: 500px;;">
        <h1>Utilidades disponibles en bootstrap</h1>
        <hr>

        <div class="m-2 p-3 text-muted bg-primary float-start float-sm-none float-md-start caja w-25 h-25 border border-primary rounded">
            caja1
        </div>
        <!--puedo poner color de fondo bg-primary
        p-3 es el padding
        y oara poner margin 0 auto para centrar se pone mx-auto-->
        <div class="m-2 p-3 text-white bg-danger float-start caja w-25 h-25 border border-success rounded">
            caja2
        </div>
        <!--text-secondary me da color a la letra-->
        <div class="m-2 p-3 text-secondary badge-warning float-start caja w-25 h-25 border border-dark rounded">
            caja3
        </div>
        <hr>
        <div class="clearfix"></div>
        <div class="shadow-lg mx-auto m-2 p-3 text-light bg-success caja w-25 h-25 border border-dark rounded">
            esto es una caja no flotada
        </div>
        <hr>
        <h2>Esto es el fin del contenedor</h2>
        <hr>
        <!--display-4 o 3 o 2 o 1 tamaños grandes del
        texto fw-bold negrita
        font-weight-light etc...
        fst-italic
        text-center
        text-decoration-none etc..-->
        <p class="display-4 p-4 fw-bold">Esto es un texto</p>

        <code>
            <!--me pone de color como para mostrar una direccion-->
            https://marcoweb.online/
        </code>
    </div>
</body>

<script type="text/javascript" src="jquery/jquery-4.0.0.min.js"></script>
<script type="text/javascript" src="bootstrap/js/bootstrap.min.js"></script>
</html>
