<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina con css</title>
    <link rel="stylesheet" href="style.css" type="text/css"> <!-- link es para enlazar un archivo externo, rel es para indicar la relación entre el documento y el archivo, href es para indicar la ruta del archivo, type es para indicar el tipo de archivo -->
</head>
<body>

    <style>
        h1 {
            color: blue;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }
        </style>    

    <h1 style="color: blue; font-family: Arial, sans-serif; font-size: 24px;">Hola mundo</h1>
</body>
</html>
